# Family location sharing: an OwnTracks Recorder plus a small Caddy proxy in
# front of it. Start it together with the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.location.yml up -d
#
# and set LOCATION_RECORDER_URL=http://recorder:8083 in .env.
#
# The Recorder has no authentication of its own, so it is never published.
# Only the proxy is reachable from outside (through your reverse proxy or
# tunnel), and the proxy only lets authenticated phones POST to /pub. The
# app reads positions from the Recorder over the internal network.
# See docs: Features > Family locations.

services:
  recorder:
    # Pin a version tag once you have checked which ones are published.
    image: owntracks/recorder:latest
    container_name: nametag-recorder
    restart: unless-stopped
    environment:
      OTR_PORT: "0"            # no MQTT, HTTP only
      OTR_HTTPHOST: "0.0.0.0"
      OTR_HTTPPORT: "8083"
    # Keep only each phone's last position, no movement history.
    command: ["--norec"]
    volumes:
      - recorder_store:/store
    networks:
      - nametag-network

  recorder-proxy:
    image: caddy:2-alpine
    container_name: nametag-recorder-proxy
    restart: unless-stopped
    volumes:
      - ./location/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - recorder
    networks:
      - nametag-network
      - proxy

volumes:
  recorder_store:
    driver: local
